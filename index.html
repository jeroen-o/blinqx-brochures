<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blinqx Verzekering &amp; Hypotheek — Brochures 2026</title>
<link rel="stylesheet" href="ds-styles.css">
<style>
html,body{margin:0;height:100%}
body{font-family:var(--font-body, Archivo, Helvetica, Arial, sans-serif);color:#1d2733;background:#f3f2f2}
.wrap{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bar{background:#ffcd00;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:170px;height:auto;display:block}
.kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.actions{display:flex;align-items:center;gap:10px}
.btn{font-family:var(--font-heading, Archivo, Helvetica, Arial, sans-serif);font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:0;padding:12px 20px;cursor:pointer;background:#1d2733;color:#ffcd00;text-decoration:none;display:inline-block}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:#1d2733;border:2px solid #1d2733;padding:10px 18px}
.btn.ghost:hover{background:#1d2733;color:#ffcd00}
.btn:focus-visible{outline:2px solid #1d2733;outline-offset:2px}
.tabs{display:flex;gap:1px;background:#1d2733;flex:none;overflow-x:auto}
.tab{flex:none;text-align:left;border:0;cursor:pointer;padding:13px 20px 15px;background:#1d2733;color:#fff;font-family:inherit}
.tab[aria-selected="true"]{background:#ffcd00;color:#1d2733}
.tab small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.65}
.tab span{display:block;font-family:var(--font-heading, Archivo, Helvetica, Arial, sans-serif);font-size:14.5px;font-weight:800;margin-top:3px}
.stage{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
@media (max-width:820px){
  .bar{padding:12px 14px;gap:12px}
  .brand img{width:130px}
  .actions{width:100%;gap:8px}
  .btn{flex:1;text-align:center;padding:12px 10px;font-size:12px}
  .btn.ghost{padding:10px 10px}
  .tab{padding:11px 14px 13px}
  .tab span{font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">
      <img src="assets/blinqx-vh-logo.png" alt="Blinqx Verzekering &amp; Hypotheek">
      <span class="kicker">Brochures 2026</span>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="printBtn">Print deze brochure</button>
      <a class="btn ghost" id="openBtn" href="productoverzicht.html" target="_blank" rel="noopener">Los openen</a>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" type="button" data-file="productoverzicht.html" aria-selected="true"><small>Compleet</small><span>Productoverzicht</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-hypotheek.html" aria-selected="false"><small>Product</small><span>eBlinqx Hypotheek</span></button>
        <button class="tab" role="tab" type="button" data-file="eblinqx-advies-bemiddeling-start.html" aria-selected="false"><small>Product</small><span>Advies &amp; Bemiddeling Start</span></button>
        <button class="tab" role="tab" type="button" data-file="vcn-partner.html" aria-selected="false"><small>Partnerformule</small><span>VCN Partner</span></button>
            <button class="tab" role="tab" type="button" data-file="blinqx-banking-insurance-partners.html" aria-selected="false"><small>Ketenpartners</small><span>Banking, Insurance &amp; Partners</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-hypotheek-advies.html" aria-selected="false"><small>Product</small><span>eBlinqx Hypotheek Advies</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-vh-compleet.html" aria-selected="false"><small>Propositie</small><span>eBlinqx V&amp;H Compleet</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-verzekering.html" aria-selected="false"><small>Product</small><span>eBlinqx Verzekering Provinciaal</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-volmacht.html" aria-selected="false"><small>Product</small><span>eBlinqx Verzekering Volmacht</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-connect-crm.html" aria-selected="false"><small>Product</small><span>eBlinqx CRM</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-beurs.html" aria-selected="false"><small>Product</small><span>eBlinqx Verzekering Beurs</span></button>
    <button class="tab" role="tab" type="button" data-file="eblinqx-makelaardij.html" aria-selected="false"><small>Product</small><span>eBlinqx Makelaardij</span></button>
  </div>
  <div class="stage"><iframe id="frame" title="Brochure" src="productoverzicht.html"></iframe></div>
</div>
<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var frame=document.getElementById('frame');
  var openBtn=document.getElementById('openBtn');
  function select(i){
    tabs.forEach(function(t,n){t.setAttribute('aria-selected',n===i?'true':'false');});
    var f=tabs[i].getAttribute('data-file');
    frame.src=f; openBtn.href=f;
    try{localStorage.setItem('blinqx-brochure-tab',String(i));}catch(e){}
  }
  tabs.forEach(function(t,i){t.addEventListener('click',function(){select(i);});});
  document.getElementById('printBtn').addEventListener('click',function(){
    var w=frame.contentWindow; if(w){w.focus();w.print();}
  });
  try{
    var saved=parseInt(localStorage.getItem('blinqx-brochure-tab'),10);
    if(!isNaN(saved)&&saved>=0&&saved<tabs.length&&saved!==0) select(saved);
  }catch(e){}
})();
</script>
</body>
</html>
